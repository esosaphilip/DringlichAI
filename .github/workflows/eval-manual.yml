name: Manual evaluation

# INTENTIONALLY MANUAL — no push or pull_request trigger.
#
# The full triage evaluation (eval/run_eval.py) drives the real pipeline and therefore needs a live
# local Ollama server with `mistral` and `nomic-embed-text` pulled. That makes it slow and dependent
# on exact model/Ollama versions, so it is never run automatically. Trigger it by hand — from the
# "Run workflow" button here, or locally — after ANY change that could affect triage quality: the
# prompt, the guideline PDF, the retrieval settings, or the models themselves.
#
# It deliberately does NOT commit anything. Review the refreshed eval/results.md, then update
# eval/baseline.json and commit BOTH by hand. An LLM-dependent number drifts with model and Ollama
# versions, so it must never be accepted — or written back — silently.

on:
  workflow_dispatch:

jobs:
  evaluate:
    name: Run the full LLM evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            langgraph langchain-core langchain-ollama langchain-community \
            langchain-chroma langchain-text-splitters chromadb pypdf

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the models
        run: |
          nohup ollama serve > ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            ollama list >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull mistral
          ollama pull nomic-embed-text

      - name: Build the guideline vector store
        # chroma_triage_db/ is gitignored, so a fresh checkout has no retrieval index yet.
        run: python triagestore.py

      - name: Run the evaluation
        run: python eval/run_eval.py

      - name: Upload the refreshed results for review
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.md
          if-no-files-found: error
